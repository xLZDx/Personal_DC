[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-dc"
version = "0.1.0"
description = "Private policy-enforced MCP gateway for a Windows workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.29,<2"]

[project.scripts]
personal-dc = "personal_dc.server:main"
personal-dc-doctor = "personal_dc.doctor:main"

[tool.setuptools.packages.find]
include = ["personal_dc*", "dc_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_v2", "tests_phase02", "tests_phase03", "tests_winops"]
addopts = "-q"
