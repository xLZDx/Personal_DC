name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        shell: pwsh
        run: python -m pip install -e . pytest

      - name: Compile
        shell: pwsh
        run: python -m compileall -q personal_dc run_server.py

      - name: Test
        shell: pwsh
        run: python -m pytest -q
